server {
    listen 80;
    server_name _;

    # Cuerpos grandes: el backend acepta JSON de hasta 10mb
    # (packages/backend/src/app.ts -> express.json({ limit: '10mb' }))
    client_max_body_size 10m;

    # Health check del backend.
    # OJO: la ruta real es GET /health en la raíz, no /api/health
    # (packages/backend/src/app.ts -> app.use("/", healthRouter)).
    # Sin este bloque, /health cae en `location /` y devuelve index.html.
    location = /health {
        proxy_pass http://127.0.0.1:3001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy al backend Express
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El pipeline clona el repo y llama a Bedrock: puede tardar.
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # Frontend estático (SPA: todo lo no resuelto cae en index.html)
    location / {
        root /home/ec2-user/trazia/packages/frontend/dist;
        try_files $uri $uri/ /index.html;
    }
}
